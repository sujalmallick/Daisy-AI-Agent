[package]
name = "daisy"
version = "0.1.0"
description = "Daisy — Windows Desktop AI Voice Assistant"
authors = ["Sujal Mallick"]
edition = "2021"

[lib]
name = "daisy_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-global-shortcut = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
